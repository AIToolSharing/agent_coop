# coop: TLS in front of the hub with the self-signed certificate that tls-selfsigned.sh makes.
# Clients pin the certificate's fingerprint (coop login); no client trusts it any other way.
server {
    listen __PORT__ ssl;
    listen [::]:__PORT__ ssl;
    ssl_certificate     /etc/coop/tls/cert.pem;
    ssl_certificate_key /etc/coop/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # The live feeds are server-sent events: no buffering, long timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 1m;
    }
}
