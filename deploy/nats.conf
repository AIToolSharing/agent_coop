# NATS server for coop. Only coop-hub and coop-tui connect, from this host.
# Agent machines never connect here: they use the hub's HTTPS API.
#
# Set these environment variables for the nats-server process (for example in a systemd
# EnvironmentFile with mode 0600). The file itself holds no secrets.
#   COOP_HUB_NATS_PASSWORD       password of user "hub"
#   COOP_OPERATOR_NATS_PASSWORD  password of user "operator" (the TUI)

listen: 127.0.0.1:4222
server_name: coop

jetstream {
  store_dir: /var/lib/nats
}

accounts {
  COOP {
    jetstream: enabled
    users: [
      { user: hub, password: $COOP_HUB_NATS_PASSWORD }
      { user: operator, password: $COOP_OPERATOR_NATS_PASSWORD }
    ]
  }
}
