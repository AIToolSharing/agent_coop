# NATS server for coop. Only coop-hub connects, from this host. Agent machines and the TUI
# never connect here: they use the hub's HTTPS API.
#
# Set this environment variable for the nats-server process (for example in a systemd
# EnvironmentFile with mode 0600). The file itself holds no secrets.
#   COOP_HUB_NATS_PASSWORD       password of user "hub"

listen: 127.0.0.1:4222
server_name: coop

jetstream {
  store_dir: /var/lib/nats
  # Write each message to disk before the publish is acknowledged. Agent traffic is small, so
  # the cost is low, and an acknowledged message survives a power loss.
  sync_interval: always
}

accounts {
  COOP {
    jetstream: enabled
    users: [
      { user: hub, password: $COOP_HUB_NATS_PASSWORD }
    ]
  }
}
